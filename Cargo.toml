[workspace]
members = [".", "conformance", "consistency", "fit", "fit/wasm"]

[package]
name = "pgcache"
version = "0.6.3"
edition = "2024"
license = "Elastic-2.0"

[[bin]]
name = "pgcache"
path = "src/main.rs"
required-features = ["proxy"]

[lib]
name = "pgcache_lib"
path = "src/lib.rs"
doctest = false

[lints.rust]
# `tokio_unstable` is set via RUSTFLAGS for the task-dump / console builds.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
panic = "deny"
string_slice = "deny"
indexing_slicing = "warn"
unwrap_used = "warn"
unchecked_time_subtraction = "warn"

fn_params_excessive_bools = "deny"
fallible_impl_from = "warn"
wildcard_enum_match_arm = "warn"
unneeded_field_pattern = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
str_to_string = "warn"
implicit_clone = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"

await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"

rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"

# unnecessary_wraps = "warn"
# must_use_candidate = "deny"

[profile.release]
lto = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
lto = false
split-debuginfo = "unpacked"

[features]
default = ["proxy"]
# The proxy runtime: wire protocol, origin/cache connections, TLS, metrics,
# telemetry. Off, the crate is the pure query-analysis surface that
# pgcache-fit (and its wasm build) compile against.
proxy = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-stream",
    "dep:futures-util",
    "dep:tokio-postgres",
    "dep:postgres-replication",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:rustls-pemfile",
    "dep:webpki-roots",
    "dep:tokio-rustls",
    "dep:tracing-appender",
    "dep:tracing-subscriber",
    "dep:nu-ansi-term",
    "dep:hdrhistogram",
    "dep:mimalloc",
    "dep:uuid",
    "dep:reqwest",
    "dep:webpki-root-certs",
    "dep:signal-hook",
    "dep:nix",
    "dep:metrics",
    "dep:metrics-util",
    "dep:metrics-exporter-prometheus",
    "dep:hyper",
    "dep:socket2",
    "dep:hyper-util",
    "dep:http",
    "dep:http-body-util",
    "dep:async-stream",
    "dep:lru",
]
console = ["proxy", "dep:console-subscriber"]
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
# Test-only deterministic fault injection (e.g. forcing a CDC-frame 40P01 to
# exercise PGC-147 recovery). Off by default; compiled out of normal builds.
fault-injection = []
# Heap allocation profiling: swaps the global allocator to dhat::Alloc and writes
# dhat-heap.json on clean exit. Off by default; profiling/dev only.
dhat-heap = ["dep:dhat"]
# Allocator A/B for memory investigations: drop the mimalloc global allocator and
# use the platform malloc. Off by default.
system-allocator = []
# Tokio task-dump on SIGUSR2 (deadlock debugging): logs every task's suspended
# await backtrace. Build with `RUSTFLAGS="--cfg tokio_unstable" cargo build
# --features taskdump` (the `tokio/taskdump` feature enables the dump API; the
# `tokio_unstable` cfg is also required). Linux x86_64/aarch64 only.
taskdump = ["proxy", "tokio/taskdump"]

[dependencies]
arc-swap = "1.8.2"
dashmap = "6.1.0"
lru = { version = "0.18.0", optional = true }
tokio = { version = "1.50.0", features = ["full"], optional = true }
tokio-util = { version = "0.7.18", optional = true }
tokio-stream = { version = "0.1.18", optional = true }
futures-util = { version = "0.3.32", optional = true }
itoa = "1.0.18"

# tokio-postgres = { path = "../rust-postgres/tokio-postgres", default-features = false, features = ["runtime"] }
# postgres-protocol = { path = "../rust-postgres/postgres-protocol" }
# postgres-replication = { path = "../rust-postgres/postgres-replication", default-features = false }
# postgres-types = { path = "../rust-postgres/postgres-types" }
tokio-postgres = { git = "https://github.com/PgCache/rust-postgres", default-features = false, features = ["runtime"], branch = "compat", optional = true }
postgres-protocol = {git = "https://github.com/PgCache/rust-postgres", branch = "compat" }
postgres-replication = { git = "https://github.com/PgCache/rust-postgres", default-features = false, branch = "compat", optional = true }
postgres-types = { git = "https://github.com/PgCache/rust-postgres", branch = "compat" }
pg_query = "6.1.1"

# TLS support for origin database connections
rustls = { version = "0.23.37", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1.14.0", optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }
webpki-roots = { version = "1.0.6", optional = true }
tokio-rustls = { version = "0.26.4", optional = true }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-appender = { version = "0.2.5", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
nu-ansi-term = { version = "0.50.3", optional = true }
phf = { version = "0.14.0", features = ["macros"] }
error_set = "0.9.1"
rootcause = "0.13.0"
lexopt = "0.3.2"
async-stream = { version = "0.3.6", optional = true }
iddqd = "0.4.5"
ecow = "0.3.0"
strum = "0.28.0"
strum_macros = "0.28.0"
toml = "1.0.6"
toml_edit = "0.25.11"
hdrhistogram = { version = "7.5.4", optional = true }
ordered-float = "5.1.0"
hotpath = { version = "0.15.1", optional = true }
console-subscriber = { version = "0.5.0", optional = true }
mimalloc = { version = "0.1.49", optional = true }
dhat = { version = "0.3.3", optional = true }
uuid = { version = "1.17.0", features = ["v4"], optional = true }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json"], optional = true }
webpki-root-certs = { version = "1.0.7", optional = true }
signal-hook = { version = "0.4.3", features = ["iterator"], optional = true }
nix = { version = "0.31.2", features = ["fs", "signal"], optional = true }
metrics = { version = "0.24.3", optional = true }
metrics-util = { version = "0.20.1", optional = true }
metrics-exporter-prometheus = { version = "0.18.1", optional = true }
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "http1"], optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
socket2 = { version = "0.6.4", optional = true }
bytes = "1"
fallible-iterator = "0.2.0"
smallvec = "1.15.1"

[dev-dependencies]
pgtemp = "0.7.1"
criterion = { version = "0.8.2", features = ["html_reports"] }
regex-lite = "0.1.9"

[[bench]]
name = "subsumption_index"
harness = false

[patch.crates-io]
# Local path while pg_query changes accumulate (bindgen allowlist); push the
# fork and restore the git patch when the churn settles.
pg_query = { path = "../pg_query.rs" }
