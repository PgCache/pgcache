[package]
name = "pgcache-fit"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pgcache-fit"
path = "src/main.rs"

[dependencies]
pgcache = { path = ".." }
pg_query = "6.1.1"
postgres-types = { git = "https://github.com/PgCache/rust-postgres", branch = "compat" }
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.102"
ecow = "0.3.0"
iddqd = "0.4.5"
bytes = "1.11.1"
csv = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
